{% extends "base.html" %}

{% load i18n %}

{% block content %}
  <div class="card form-card">
    <div class="card-body">
      <form method="post" action="{% url 'accounts:password_change' %}">
        {% csrf_token %}
        {% include "includes/form.html" %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">{% translate "Enregistrer" %}</button>
          <a class="btn btn-outline-secondary"
             href="{% url 'accounts:settings' %}">{% translate "Annuler" %}</a>
        </div>
      </form>
    </div>
  </div>
{% endblock content %}
