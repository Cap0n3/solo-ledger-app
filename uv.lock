version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "django" },
    { name = "django-stubs-ext" },
    { name = "pillow" },
    { name = "psycopg", extra = ["binary"] },
]

[package.dev-dependencies]
dev = [
    { name = "django-stubs", extra = ["compatible-mypy"] },
    { name = "djlint" },
    { name = "factory-boy" },
    { name = "mypy" },
    { name = "pytest" },
    { name = "pytest-django" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "django", specifier = "==6.1.2" },
    { name = "django-stubs-ext", specifier = ">=6.1.2" },
    { name = "pillow", specifier = ">=12.0" },
    { name = "psycopg", extras = ["binary"], specifier = ">=3.3.6,<4" },
]

[package.metadata.requires-dev]
dev = [
    { name = "django-stubs", extras = ["compatible-mypy"], specifier = ">=6.1.2" },
    { name = "djlint", specifier = ">=1.46.6" },
    { name = "factory-boy", specifier = ">=3.3.3" },
    { name = "mypy", specifier = ">=2.4.0" },
    { name = "pytest", specifier = ">=9.1.1" },
    { name = "pytest-django", specifier = ">=4.14.0" },
    { name = "ruff", specifier = ">=0.17.1" },
]

