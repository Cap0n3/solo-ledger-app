[project]
name = "sololedger"
version = "0.1.0"
description = "Accounting and student management for independent music teachers"
requires-python = ">=3.14"
dependencies = [
    "django==6.1.2",
    "django-stubs-ext>=6.1.2",
    "pillow>=12.0",
    "psycopg[binary]>=3.3.6,<4",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "djlint>=1.46.6",
    "factory-boy>=3.3.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

# --- Ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["**/migrations/"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "DJ",            # django
    "ANN",           # type annotations
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "T20",           # no print()
    "PTH",           # pathlib
]
# French typography in user-facing strings: apostrophe, NBSP, narrow NBSP, guillemets.
allowed-confusables = ["’", " ", " ", "«", "»"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["core"]

# --- mypy -------------------------------------------------------------------

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]
files = ["core", "manage.py"]
exclude = ["/migrations/"]

# factory_boy ships py.typed but re-exports its declarations without __all__.
[[tool.mypy.overrides]]
module = ["factory", "factory.*"]
implicit_reexport = true

# Tests are exempt from full annotation; factory_boy's create() is untyped.
[[tool.mypy.overrides]]
module = ["core.apps.*.tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "core.config.settings.test"

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
addopts = "--ds=core.config.settings.test"
python_files = ["test_*.py"]
testpaths = ["core"]

# --- djLint -----------------------------------------------------------------

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 110
format_css = false
format_js = false
blank_line_after_tag = "load,extends"
use_gitignore = true
