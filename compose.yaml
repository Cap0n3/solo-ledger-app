services:
  db:
    image: postgres:18.6
    env_file: .env
    volumes:
      # PostgreSQL 18 images declare their volume at /var/lib/postgresql
      # (PGDATA is /var/lib/postgresql/18/docker), no longer at .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
